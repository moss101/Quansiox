<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" />
  <title>Quansiox Companion</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; height: 100%; background: transparent; overflow: hidden;
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .qx-panel {
      height: 100%; box-sizing: border-box; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 8px;
      border-radius: 14px;
      background: rgba(20, 22, 30, 0.92);
      border: 1px solid rgba(140, 160, 255, 0.28);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
      color: #e6edf3;
      -webkit-app-region: drag;
    }
    .qx-panel-head { display: flex; align-items: center; gap: 8px; }
    .qx-panel-mark { width: 22px; height: 22px; border-radius: 6px; background: #4f6ef7; }
    .qx-panel-mark-fallback { display: grid; place-items: center; font-weight: 700; color: #fff; }
    .qx-panel-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .qx-panel-status { font-size: 11px; opacity: 0.7; }
    .qx-panel-status-working { opacity: 1; color: #7ee787; }
    .qx-panel-choices { display: flex; flex-wrap: wrap; gap: 6px; -webkit-app-region: no-drag; }
    .qx-panel-choice {
      border: 1px solid rgba(140, 160, 255, 0.3); background: rgba(90, 110, 220, 0.16);
      color: #e6edf3; border-radius: 999px; padding: 3px 10px; font-size: 11px; cursor: pointer;
    }
    .qx-panel-choice:hover { background: rgba(90, 110, 220, 0.3); }
    .qx-panel-form { display: flex; gap: 6px; -webkit-app-region: no-drag; }
    .qx-panel-form input {
      flex: 1; min-width: 0; border-radius: 8px; border: 1px solid rgba(140, 160, 255, 0.25);
      background: rgba(0, 0, 0, 0.35); color: inherit; padding: 5px 9px; font: inherit;
    }
    .qx-panel-form button {
      border: 0; border-radius: 8px; background: #4f6ef7; color: #fff;
      width: 30px; cursor: pointer; font: inherit;
    }
    .qx-panel-form button:disabled { opacity: 0.4; cursor: default; }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script type="module" src="assets/panel.js"></script>
</body>
</html>
